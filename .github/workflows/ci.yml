# SPDX-License-Identifier: MIT
# Integration build: every component workflow, then one installer from their real artifacts, tested end to end.
# The component workflows still run on their own for pushes that touch only their folder.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # service.yml may fetch a native-win-x64 artifact; a called workflow cannot get more than the caller grants

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/native.yml
  drivers:
    uses: ./.github/workflows/drivers.yml
  service:
    uses: ./.github/workflows/service.yml
  worker:
    uses: ./.github/workflows/worker.yml
  web-installer:
    uses: ./.github/workflows/web-installer.yml

  package:
    name: Installer (real artifacts)
    needs: [native, drivers, service, worker, web-installer]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      APP_VERSION: 0.1.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: build/artifacts
          pattern: '{native,drivers,service,worker}-win-x64'

      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: build/artifacts/web-dist

      - name: Stage
        run: |
          $a = 'build/artifacts'; $s = 'build/stage'
          if (Test-Path $s) { Remove-Item -Recurse -Force $s }
          foreach ($d in 'service', 'tray', 'native', 'worker', 'drivers') { New-Item -ItemType Directory -Force "$s/$d" | Out-Null }
          Copy-Item -Recurse "$a/service-win-x64/service/*" "$s/service"
          Copy-Item "$a/service-win-x64/cli/splitplay.exe" "$s/service"
          Remove-Item -Recurse -Force "$s/service/wwwroot"
          Copy-Item -Recurse "$a/web-dist" "$s/service/wwwroot"
          Copy-Item -Recurse "$a/service-win-x64/tray/*" "$s/tray"
          Copy-Item -Recurse "$a/native-win-x64/*" "$s/native"
          # TermWrap is built with the native part but installed to its own folder.
          if (Test-Path "$s/native/termwrap") { Move-Item "$s/native/termwrap" "$s/termwrap" }
          Copy-Item -Recurse "$a/worker-win-x64/*" "$s/worker"
          Copy-Item -Recurse "$a/drivers-win-x64/*" "$s/drivers"
          foreach ($d in Get-ChildItem $s -Directory) {
            $files = Get-ChildItem $d.FullName -Recurse -File
            '{0}: {1} files, {2:N1} MB' -f $d.Name, $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)
          }

      # ViGEmBus (nefarius/ViGEmBus, BSD-3-Clause): interim gamepads until the Stage 4 pad driver. The official signed
      # setup, pinned by URL and SHA256, bundled unmodified; setup runs it only when no ViGEmBus driver is present.
      - name: Stage ViGEmBus setup (pinned, SHA256-checked)
        env:
          VIGEMBUS_URL: https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe
          VIGEMBUS_SHA256: 89220a7865076b342892f98865f3499fb7c4cfd673159e89d352c360fd014c6a
        run: |
          $dir = New-Item -ItemType Directory -Force build/stage/vigembus
          $file = Join-Path $dir ([IO.Path]::GetFileName($env:VIGEMBUS_URL))
          Invoke-WebRequest -Uri $env:VIGEMBUS_URL -OutFile $file -MaximumRetryCount 3 -RetryIntervalSec 5
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash
          if ($hash -ne $env:VIGEMBUS_SHA256) { throw "ViGEmBus setup SHA256 $hash does not match the pinned $env:VIGEMBUS_SHA256" }
          $sig = Get-AuthenticodeSignature $file
          "$((Get-Item $file).Name): SHA256 ok, signature $($sig.Status), signer $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { "::warning::ViGEmBus setup signature status is $($sig.Status) (the SHA256 pin matched)" }

      - name: Locate Inno Setup
        run: |
          function Find-Iscc {
            foreach ($root in ${env:ProgramFiles(x86)}, $env:ProgramFiles) {
              foreach ($v in '6', '7') {
                $p = Join-Path $root "Inno Setup $v\ISCC.exe"
                if (Test-Path $p) { return $p }
              }
            }
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'ISCC.exe not found' }
          "ISCC=$iscc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Compile installer
        run: |
          & $env:ISCC "/DStageDir=$PWD\build\stage" "/DAppVersion=$env:APP_VERSION" "/DOutputDir=$PWD\build\installer" installer\splitplay.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem build/installer | ForEach-Object { '{0} {1:N1} MB' -f $_.Name, ($_.Length / 1MB) }

      - name: Smoke test (silent install, upgrade, uninstall)
        run: ./installer/ci/Test-Installer.ps1 -Setup (Get-Item build/installer/SplitPlay-Setup-*.exe).FullName -LogDir build/logs -RealStage

      - name: End-to-end test (installed service runs a desk with the stub worker)
        run: ./installer/ci/Test-EndToEnd.ps1 -Setup (Get-Item build/installer/SplitPlay-Setup-*.exe).FullName -LogDir build/logs

      - uses: actions/upload-artifact@v5
        with:
          name: SplitPlay-Setup
          path: build/installer/SplitPlay-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: package-logs
          path: build/logs
          if-no-files-found: ignore
          retention-days: 7
